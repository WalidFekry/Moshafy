apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'


android {
    compileSdk = 37
    defaultConfig {
        applicationId "com.appwalied.quran"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 46
        versionName "6.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    viewBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.appwalied.quran'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.firebase:firebase-database:23.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.code-mc:material-icon-lib:1.1.5'
    implementation 'com.github.naseemali925:ShapedNavigationView:1.0.0'
    implementation 'com.romainpiel.shimmer:library:1.4.0@aar'
    implementation 'com.github.mjn1369:prettydialog:1.0.4'
    implementation 'com.github.guy-4444:SmartRateUsDialog-Android:1.00.08'
    implementation "com.airbnb.android:lottie:6.7.1"
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'
    implementation 'com.google.firebase:firebase-messaging:26.0.1'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.google.firebase:firebase-crashlytics:21.0.1'
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'
    implementation 'androidx.window:window:1.5.1'
}
